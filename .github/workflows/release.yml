# Pushing a version tag (like 0.1.0) builds the worker for Windows and Linux with that version and the release key in
# src/release-key.pub, signs their manifest with BAR-Rewind's sign tool and publishes the release. The key lives in
# the `release` environment, which only version tags can use; it is the same key BAR-Rewind's releases are signed with.
name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: burnhamrobertp/BAR-Rewind
          ref: master
          path: bar-rewind
          persist-credentials: false

      - name: Install Zig 0.17.0
        run: |
          curl -sSfLo zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          echo "1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"

      - name: Test
        run: zig build test

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          key=$(cat src/release-key.pub)
          [ ${#key} -eq 64 ] || { echo "src/release-key.pub holds no release key: the workers built here could never update" >&2; exit 1; }
          zig build dist "-Dversion=$TAG"

      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          cd bar-rewind
          zig build sign -- manifest ../zig-out/dist "$TAG"
          key=$(cat ../src/release-key.pub)
          zig build sign -- verify ../zig-out/dist "$key"

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" zig-out/dist/* --verify-tag --latest --title "bar-rewind-worker $TAG" --generate-notes
